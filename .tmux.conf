# prefix setting (screen-like)
set -g prefix C-a
unbind C-b
bind a send-prefix

# reload config file
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded!"

bind-key C-a last-window

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# "|" splits the current window vertically, and "-" splits it horizontally
unbind %
bind | split-window -h
bind - split-window -v

bind -r n next-window
bind -r p previous-window
# prefix A: unstick window-size — clears the per-window `manual` lock that
# any prior `resize-window` (including webtmux's agent driving session 0)
# leaves behind, so the window goes back to following the attached client's
# SIGWINCH per the global `window-size latest`. Previously this was
# `resize-window -A` which DID THE OPPOSITE — actively pinned the window
# to whatever max-client size it had at that moment, then never let go.
bind A set-window-option -u window-size \; display-message "window-size: now follows client"

# make delay shorter
set -sg escape-time 0

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r Left  resize-pane -L 4
bind -r Down  resize-pane -D 4
bind -r Up    resize-pane -U 4
bind -r Right resize-pane -R 4

# display things 
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"

set -g window-status-current-style bg=white,fg=black

set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command} #h"
set -g allow-passthrough on
set-option -g allow-rename off
set-window-option -g allow-rename off

# Select Layouts
#―――――――――――――――――
#bind -n M-a select-layout main-vertical
#bind -n M-A select-layout main-horizontal
#bind -n M-E select-layout even-vertical
#bind -n M-V select-layout even-horizontal

# history size
set -g history-limit 12000

#### copy mode : vim ####
# set vi mode for copy mode
setw -g mode-keys vi

set -g mouse on
bind-key m set-option -g mouse \; display-message 'Mouse #{?mouse,On,Off}'

# tmux-logging
run-shell ~/.tmux-logging/logging.tmux
set -g @logging-path $HOME/Log

# ───── TPM plugins ─────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Status bar: CPU / RAM / clock
# 因為這台 tmux server 的 #() shell substitution 失效,改用 daemon 寫 user-option 的方式
set -g status-interval 2
# 注意:status bar 是綠底黑字 (status-style bg=green),所以不用 tmux-cpu 動態字色
# (低用量時 plugin 回傳綠色字 → 綠字綠底會看不見)
set -g status-right 'CPU #{@cpu_pct} | RAM #{@ram_pct} | %H:%M '
set -g status-right-length 80

# 啟動 CPU/RAM 更新 daemon(腳本內含自我去重,重複載入不會疊加)
run-shell -b 'nohup ~/.tmux/scripts/update-cpu.sh >/dev/null 2>&1 &'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
